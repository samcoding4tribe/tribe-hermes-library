<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Where is my TRIBE?</title>
<style>
  :root{
    --bg:#f6f1e7; --land:#d8cdbb; --land-near:#f3c39a; --coast:#b8a894; --ink:#2f2a23;
    --muted:#7c7367; --accent:#c8521d; --home:#e0641f; --leave:#2c8d79;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Segoe UI",Arial,sans-serif}
  .wrap{padding:26px 30px 20px}
  h1{font-size:26px;line-height:1.15;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin:0}
  .stage{position:relative;margin-top:14px}
  svg{display:block;width:100%;height:auto}
  .land{fill:var(--land);stroke:var(--coast);stroke-width:.45}
  .land.here{fill:var(--land-near);stroke:#d98a53;stroke-width:.8}
  .ocean{fill:url(#ocean)}
  .pin-core{filter:url(#glow)}
  .graticule{fill:none;stroke:#e6ddcc;stroke-width:.5}
  .pin-emoji{font-size:17px}
  .pin-label{font-size:13px;fill:#2f2a23;font-weight:600;paint-order:stroke;stroke:#f6f1e7;stroke-width:3}
  .chip{fill:#1a1d22;stroke:#333a44}
  .chip-text{font-size:10px;fill:var(--muted)}
  .legend{display:flex;gap:20px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;vertical-align:1px}
  .unplaced{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .face{display:flex;flex-direction:column;align-items:center;gap:5px;width:74px;font-size:11px;color:var(--muted);text-align:center}
  .avatar{width:40px;height:40px;border-radius:99px;background:#efe7d8;border:1px solid #cdbfa9;
          display:grid;place-items:center;font-size:11px;color:#4a4238;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Where is my TRIBE?</h1>

  <div class="stage"><svg id="map" viewBox="0 0 1000 520" aria-label="World map of where the team is"></svg></div>

  <div class="legend">
    <span><i class="dot" style="background:var(--home)"></i>at home base, Melbourne</span>
    <span><i class="dot" style="background:var(--accent)"></i>onsite or site visit</span>
    <span><i class="dot" style="background:var(--leave)"></i>on leave or holiday</span>
    <span><i class="dot" style="background:#556"></i>location not recorded</span>
  </div>

  <div class="unplaced" id="unplaced"></div>
</div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/world.js"></script>
<script src="week-data.js"></script>
<script>
(function(){
  const MEL = [144.96, -37.81];
  const data = window.WEEK || {week_start: "2026-11-30", people: [], places: {}};
  const addDays = (iso, n) => {
    const d = new Date(iso + "T00:00:00");   // local time: toISOString would shift a day
    d.setDate(d.getDate() + n);
    const pad = x => String(x).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const week0 = data.week_start || new Date().toISOString().slice(0, 10);
  const days = [0, 1, 2, 3, 4].map(i => addDays(week0, i));
  const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-AU", {day:"numeric", month:"short"});

  document.getElementById("title").textContent =
    `Where is my TRIBE?  ${fmt(days[0])} – ${fmt(days[4])}`;

  const width = 1000, height = 520;

  // The workflow sheet writes places loosely ("Saigon & Siem Reap", "QLD", "China").
  // Resolve to a point: exact name, then any stop of a multi-stop trip, then a
  // country or state. No guess means no pin, and the person shows as unplaced.
  const COUNTRY = {
    "China": [104.2, 35.9], "Vietnam": [106.3, 16.0], "Cambodia": [104.99, 12.57],
    "Japan": [138.3, 36.2], "Thailand": [100.9, 15.9], "Indonesia": [113.9, -0.8],
    "New Zealand": [174.9, -40.9], "Fiji": [178.1, -17.7], "Singapore": [103.82, 1.35],
    "United States": [-98.6, 39.8], "USA": [-98.6, 39.8], "UK": [-1.5, 52.5],
    "England": [-1.5, 52.5], "Europe": [10.0, 48.0], "India": [78.9, 20.6],
    "QLD": [153.03, -27.47], "NSW": [151.21, -33.87], "VIC": [144.96, -37.81],
    "SA": [138.60, -34.93], "WA": [115.86, -31.95], "TAS": [147.33, -42.88],
    "NT": [130.84, -12.46], "ACT": [149.13, -35.28]
  };
  const ALIAS = {"saigon": "Ho Chi Minh City", "hcmc": "Ho Chi Minh City", "mel": "Melbourne",
                 "melb": "Melbourne", "melbourne ": "Melbourne", "syd": "Sydney", "bne": "Brisbane",
                 "bris": "Brisbane", "per": "Perth", "adl": "Adelaide", "hba": "Hobart",
                 "cns": "Cairns", "ool": "Gold Coast", "drw": "Darwin", "cbr": "Canberra",
                 "port douglas": "Cairns", "hayman island": "Cairns",
                 "sunshine coast": "Brisbane", "goldie": "Gold Coast"};
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  // Built on first use: COORDS is declared below this point.
  let _city = null, _region = null;
  const byCity = () => _city || (_city = Object.fromEntries(
    Object.entries(COORDS).map(([k, v]) => [norm(k), v])));
  const byRegion = () => _region || (_region = Object.fromEntries(
    Object.entries(COUNTRY).map(([k, v]) => [norm(k), v])));
  function coordsFor(place) {
    if (!place) return null;
    const direct = byCity()[norm(place)] || byRegion()[norm(place)];
    if (direct) return direct;
    const parts = String(place).split(/&|\/|,| and /i).map(s => s.trim()).filter(Boolean);
    const hits = parts
      .map(part => {
        const key = norm(part);
        const target = norm(ALIAS[key] || part);
        return byCity()[target] || byRegion()[target];
      })
      .filter(Boolean);
    if (!hits.length) return null;
    return [hits.reduce((a, c) => a + c[0], 0) / hits.length,
            hits.reduce((a, c) => a + c[1], 0) / hits.length];
  }
  const svg = d3.select("#map");

  const COORDS = {
    "Melbourne": [144.96, -37.81], "Adelaide": [138.60, -34.93], "Sydney": [151.21, -33.87],
    "Brisbane": [153.03, -27.47], "Perth": [115.86, -31.95], "Hobart": [147.33, -42.88],
    "Gold Coast": [153.40, -28.02], "Canberra": [149.13, -35.28], "Darwin": [130.84, -12.46],
    "Cairns": [145.77, -16.92], "Auckland": [174.76, -36.85], "Manila": [120.98, 14.60],
    "Bali": [115.19, -8.65], "Singapore": [103.82, 1.35], "Cambodia": [104.99, 12.57], "Phnom Penh": [104.92, 11.56], "London": [-0.13, 51.51],
    "Los Angeles": [-118.24, 34.05], "New York": [-74.01, 40.71], "Tokyo": [139.69, 35.69],
    "Paris": [2.35, 48.86], "Dubai": [55.27, 25.20],
    // holiday places people actually go to from here
    "Queenstown": [168.66, -45.03], "Niseko": [140.69, 42.86], "Aspen": [-106.82, 39.19],
    "Zurich": [8.54, 47.38], "Reykjavik": [-21.94, 64.15], "Honolulu": [-157.86, 21.31],
    "Nadi": [177.44, -17.75], "Port Vila": [168.32, -17.73], "Phuket": [98.39, 7.88],
    "Rome": [12.50, 41.90], "Barcelona": [2.17, 41.39], "Lisbon": [-9.14, 38.72],
    "Vancouver": [-123.12, 49.28], "Cape Town": [18.42, -33.92], "Marrakech": [-7.99, 31.63],
    "Ubud": [115.26, -8.51], "Seminyak": [115.16, -8.69], "Hanoi": [105.83, 21.03],
    "Ho Chi Minh City": [106.63, 10.82], "Siem Reap": [103.86, 13.36], "Koh Samui": [100.06, 9.51]
  };

  const pins = {};
  data.people.forEach(p => {
    const ds = Object.values(p.days || {});
    const away = ds.some(v => v.code);
    const work = ds.some(v => ["onsite", "site visit"].includes(v.label));
    const leave = ds.some(v => ["leave", "family", "other leave"].includes(v.label));
    const place = (p.places || [])[0];
    if (!place && away) return;           // unknown place: a chip, never a guess
    const key = place || "Melbourne";
    pins[key] = pins[key] || {count: 0, work: 0, leave: 0, labels: [], names: [],
                               kinds: new Set(), acts: new Set()};
    pins[key].count++;
    if (work) pins[key].work++;
    if (leave) pins[key].leave++;
    const kinds = [...new Set(ds.filter(v => v.code).map(v => v.label))];
    pins[key].labels.push(...kinds);
    pins[key].names.push(p.short || p.name.split(" ")[0]);
    ds.forEach(v => { if (v.kind) pins[key].kinds.add(v.kind); if (v.activity) pins[key].acts.add(v.activity); });
  });

  // Frame the pins, not a fixed projection: the view adapts to where the week is.
  const used = Object.keys(pins).map(k => coordsFor(k)).filter(Boolean);
  const inAustralia = used.length && used.every(([lon, lat]) =>
    lon >= 110 && lon <= 157 && lat <= -9 && lat >= -45);

  const lons = used.map(c => c[0]), lats = used.map(c => c[1]);
  let west = Math.min(...lons), east = Math.max(...lons);
  let south = Math.min(...lats), north = Math.max(...lats);

  // A single city is not a week: keep a sane minimum window so one pin does not
  // become a street map, and never cross the poles.
  const minSpan = 18;
  const padLon = Math.max((east - west) * 0.25, 3);
  const padLat = Math.max((north - south) * 0.25, 2.5);
  west -= padLon; east += padLon; north += padLat; south -= padLat;
  if (east - west < minSpan) {
    const mid = (west + east) / 2; west = mid - minSpan / 2; east = mid + minSpan / 2;
  }
  // A longitude beyond 180 reads as "the rest of the world" to d3: clamp inside.
  west = Math.max(-179, west); east = Math.min(179, east);
  south = Math.max(-60, south); north = Math.min(72, north);


  // Counter-clockwise for d3's spherical winding, or it means "the rest of the world".
  const box = {type: "Polygon", coordinates: [[
    [west, south], [west, north], [east, north], [east, south], [west, south]
  ]]};
  const proj = d3.geoMercator().fitExtent([[30, 30], [width - 30, height - 30]], box);
  const path = d3.geoPath(proj);
  window.__mapView = {inAustralia, west: Math.round(west), east: Math.round(east),
                      south: Math.round(south), north: Math.round(north)};

  const defs = svg.append("defs");
  const og = defs.append("linearGradient").attr("id", "ocean")
    .attr("x1", "0%").attr("y1", "0%").attr("x2", "35%").attr("y2", "100%");
  og.append("stop").attr("offset", "0%").attr("stop-color", "#fdfaf3");
  og.append("stop").attr("offset", "55%").attr("stop-color", "#f6f0e4");
  og.append("stop").attr("offset", "100%").attr("stop-color", "#eee5d3");
  const gl = defs.append("filter").attr("id", "glow")
    .attr("x", "-80%").attr("y", "-80%").attr("width", "260%").attr("height", "260%");
  gl.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "b");
  const merge = gl.append("feMerge");
  merge.append("feMergeNode").attr("in", "b");
  merge.append("feMergeNode").attr("in", "SourceGraphic");

  svg.append("path").attr("class", "ocean").attr("d", path({type: "Sphere"}))
     .attr("stroke", "#e0d5c2").attr("stroke-width", 1);
  svg.append("path").attr("class", "graticule")
     .attr("d", path(d3.geoGraticule().step(east - west < 60 ? [5, 5] : [20, 20])()));

  Promise.resolve(window.WORLD).then(world => {
    svg.append("g").selectAll("path")
      .data(topojson.feature(world, world.objects.countries).features)
      .join("path")
      .attr("class", d => inAustralia && d.id === "036" ? "land here" : "land")
      .attr("d", path);

    const g = svg.append("g");
    Object.entries(pins).forEach(([place, info]) => {
      const xy = coordsFor(place);
      if (!xy) return;
      const [x, y] = proj(xy);
      const isHome = place === "Melbourne";
      const onHoliday = info.kinds && info.kinds.has("holiday") && !info.kinds.has("work");
      const EMOJI = {ski: "⛷️", snowboard: "🏂", beach: "🏖️", surf: "🏄", city: "🏙️", safari: "🦁",
                     wedding: "💍", honeymoon: "🥂", festival: "🎉", cruise: "🛳️", hike: "🥾",
                     food: "🍜", golf: "⛳", park: "🎢"};
      const act = info.acts ? [...info.acts][0] : "";
      const mark = onHoliday ? (EMOJI[act] || "🌴") : "";
      const colour = isHome ? "#e0641f" : onHoliday ? "#0f8f7a" : "#c8521d";
      // A trip pin names who is there; the base pin carries a count.
      const caption = isHome
        ? place + " · " + info.count
        : place + (mark ? " " + mark.trim() : "") + " · " + (info.names || []).join(", ");
      g.append("circle").attr("cx", x).attr("cy", y)
        .attr("r", isHome ? 6 + Math.min(10, info.count * .8) : 7)
        .attr("fill", colour).attr("class", "pin-core");
      g.append("circle").attr("cx", x).attr("cy", y)
        .attr("r", isHome ? 16 + Math.min(10, info.count) : 13)
        .attr("fill", "none").attr("stroke", colour).attr("opacity", .35).attr("stroke-width", 1.2);
      g.append("line").attr("x1", x + 12).attr("y1", y).attr("x2", x + 24).attr("y2", y)
        .attr("stroke", colour).attr("stroke-width", .8).attr("opacity", .5);
      const flip = x + 30 + caption.length * 7 > width - 8;
      g.append("text").attr("x", flip ? x - 22 : x + 30).attr("y", y + 4)
        .attr("text-anchor", flip ? "end" : "start").attr("class", "pin-label")
        .text(caption);

    });

    // People with no recorded place, shown as chips rather than invented pins
    const unknown = data.people.filter(p => !(p.places || []).length && Object.values(p.days||{}).some(v => v.code));
    const box = document.getElementById("unplaced");
    if (unknown.length) {
      const label = document.createElement("div");
      label.className = "face";
      label.style.width = "auto";
      label.style.color = "#8d8578";
      label.textContent = "no location recorded:";
      box.appendChild(label);
      unknown.forEach(p => {
        const initials = p.name.split(" ").map(s => s[0]).join("").slice(0,2);
        const el = document.createElement("div");
        el.className = "face";
        el.innerHTML = `<div class="avatar">${initials}</div><div>${p.short || p.name.split(" ")[0]}</div>`;
        box.appendChild(el);
      });
    }

    window.__mapReady = true;
  });
})();
</script>
</body>
</html>
