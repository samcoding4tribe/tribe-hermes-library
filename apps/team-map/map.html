<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Where is the TRIBE</title>
<style>
  :root{
    --bg:#f6f1e7; --land:#d8cdbb; --land-near:#f3c39a; --coast:#b8a894; --ink:#2f2a23;
    --muted:#7c7367; --accent:#c8521d; --home:#e0641f; --leave:#2c8d79;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Segoe UI",Arial,sans-serif}
  .wrap{padding:26px 30px 20px}
  h1{font-size:26px;line-height:1.15;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin:0}
  .stage{position:relative;margin-top:14px}
  svg{display:block;width:100%;height:auto}
  .land{fill:var(--land);stroke:var(--coast);stroke-width:.45}
  .land.here{fill:var(--land-near);stroke:#d98a53;stroke-width:.8}
  .ocean{fill:url(#ocean)}
  .pin-core{filter:url(#glow)}
  .graticule{fill:none;stroke:#e6ddcc;stroke-width:.5}
  .pin-label{font-size:9.5px;fill:#2f2a23;font-weight:600;paint-order:stroke;stroke:#f6f1e7;stroke-width:2.6}
  .chip{fill:#1a1d22;stroke:#333a44}
  .chip-text{font-size:10px;fill:var(--muted)}
  .legend{display:flex;gap:18px;margin-top:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;vertical-align:1px}
  .unplaced{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .face{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;font-size:9.5px;color:var(--muted);text-align:center}
  .avatar{width:34px;height:34px;border-radius:99px;background:#efe7d8;border:1px solid #cdbfa9;
          display:grid;place-items:center;font-size:11px;color:#4a4238;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Where is the TRIBE?</h1>

  <div class="stage"><svg id="map" viewBox="0 0 1000 520" aria-label="World map of where the team is"></svg></div>

  <div class="legend">
    <span><i class="dot" style="background:var(--home)"></i>at home base, Melbourne</span>
    <span><i class="dot" style="background:var(--accent)"></i>onsite or site visit</span>
    <span><i class="dot" style="background:var(--leave)"></i>on leave</span>
    <span><i class="dot" style="background:#556"></i>location not recorded</span>
  </div>

  <div class="unplaced" id="unplaced"></div>
</div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/world.js"></script>
<script src="week-data.js"></script>
<script>
(function(){
  const MEL = [144.96, -37.81];
  const data = window.WEEK || {week_start: "2026-11-30", people: [], places: {}};
  const days = ["2026-11-30","2026-12-01","2026-12-02","2026-12-03","2026-12-04"];
  const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-AU", {day:"numeric", month:"short"});

  document.getElementById("title").textContent =
    `Where is the TRIBE?  ${fmt(days[0])} – ${fmt(days[4])}`;

  const width = 1000, height = 520;
  const svg = d3.select("#map");

  const COORDS = {
    "Melbourne": [144.96, -37.81], "Adelaide": [138.60, -34.93], "Sydney": [151.21, -33.87],
    "Brisbane": [153.03, -27.47], "Perth": [115.86, -31.95], "Hobart": [147.33, -42.88],
    "Gold Coast": [153.40, -28.02], "Canberra": [149.13, -35.28], "Darwin": [130.84, -12.46],
    "Cairns": [145.77, -16.92], "Auckland": [174.76, -36.85], "Manila": [120.98, 14.60],
    "Bali": [115.19, -8.65], "Singapore": [103.82, 1.35], "London": [-0.13, 51.51],
    "Los Angeles": [-118.24, 34.05], "New York": [-74.01, 40.71], "Tokyo": [139.69, 35.69],
    "Paris": [2.35, 48.86], "Dubai": [55.27, 25.20]
  };

  const pins = {};
  data.people.forEach(p => {
    const ds = Object.values(p.days || {});
    const away = ds.some(v => v.code);
    const work = ds.some(v => ["onsite", "site visit"].includes(v.label));
    const leave = ds.some(v => ["leave", "family", "other leave"].includes(v.label));
    const place = (p.places || [])[0];
    if (!place && away) return;           // unknown place: a chip, never a guess
    const key = place || "Melbourne";
    pins[key] = pins[key] || {count: 0, work: 0, leave: 0};
    pins[key].count++;
    if (work) pins[key].work++;
    if (leave) pins[key].leave++;
  });

  // Stay in Australia when that is where everyone is; world otherwise.
  const used = Object.keys(pins).map(k => COORDS[k]).filter(Boolean);
  const inAustralia = used.length && used.every(([lon, lat]) =>
    lon >= 110 && lon <= 157 && lat <= -9 && lat >= -45);
  const AU = {type: "Polygon", coordinates: [[[112, -9], [155, -9], [155, -45], [112, -45], [112, -9]]]};
  const proj = inAustralia
    ? d3.geoMercator().fitExtent([[26, 26], [width - 26, height - 26]], AU)
    : d3.geoNaturalEarth1().fitExtent([[8, 8], [width - 8, height - 8]], {type: "Sphere"});
  const path = d3.geoPath(proj);

  const defs = svg.append("defs");
  const og = defs.append("linearGradient").attr("id", "ocean")
    .attr("x1", "0%").attr("y1", "0%").attr("x2", "35%").attr("y2", "100%");
  og.append("stop").attr("offset", "0%").attr("stop-color", "#fdfaf3");
  og.append("stop").attr("offset", "55%").attr("stop-color", "#f6f0e4");
  og.append("stop").attr("offset", "100%").attr("stop-color", "#eee5d3");
  const gl = defs.append("filter").attr("id", "glow")
    .attr("x", "-80%").attr("y", "-80%").attr("width", "260%").attr("height", "260%");
  gl.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "b");
  const merge = gl.append("feMerge");
  merge.append("feMergeNode").attr("in", "b");
  merge.append("feMergeNode").attr("in", "SourceGraphic");

  svg.append("path").attr("class", "ocean").attr("d", path({type: "Sphere"}))
     .attr("stroke", "#e0d5c2").attr("stroke-width", 1);
  svg.append("path").attr("class", "graticule")
     .attr("d", path(d3.geoGraticule().step(inAustralia ? [5, 5] : [20, 20])()));

  Promise.resolve(window.WORLD).then(world => {
    svg.append("g").selectAll("path")
      .data(topojson.feature(world, world.objects.countries).features)
      .join("path")
      .attr("class", d => inAustralia && d.id === "036" ? "land here" : "land")
      .attr("d", path);

    const g = svg.append("g");
    Object.entries(pins).forEach(([place, info]) => {
      const xy = COORDS[place];
      if (!xy) return;
      const [x, y] = proj(xy);
      const isHome = place === "Melbourne";
      const colour = isHome ? "#e0641f" : info.work ? "#c8521d" : "#2c8d79";
      g.append("circle").attr("cx", x).attr("cy", y)
        .attr("r", isHome ? 6 + Math.min(10, info.count * .8) : 7)
        .attr("fill", colour).attr("class", "pin-core");
      g.append("circle").attr("cx", x).attr("cy", y)
        .attr("r", isHome ? 16 + Math.min(10, info.count) : 13)
        .attr("fill", "none").attr("stroke", colour).attr("opacity", .35).attr("stroke-width", 1.2);
      g.append("line").attr("x1", x + 12).attr("y1", y).attr("x2", x + 24).attr("y2", y)
        .attr("stroke", colour).attr("stroke-width", .8).attr("opacity", .5);
      g.append("text").attr("x", x + 28).attr("y", y + 4).attr("class", "pin-label")
        .text(place + " · " + info.count);
    });

    // People with no recorded place, shown as chips rather than invented pins
    const unknown = data.people.filter(p => !(p.places || []).length && Object.values(p.days||{}).some(v => v.code));
    const box = document.getElementById("unplaced");
    if (unknown.length) {
      const label = document.createElement("div");
      label.className = "face";
      label.style.width = "auto";
      label.style.color = "#8d8578";
      label.textContent = "no location recorded:";
      box.appendChild(label);
      unknown.forEach(p => {
        const initials = p.name.split(" ").map(s => s[0]).join("").slice(0,2);
        const el = document.createElement("div");
        el.className = "face";
        el.innerHTML = `<div class="avatar">${initials}</div><div>${p.name.split(" ")[0]}</div>`;
        box.appendChild(el);
      });
    }

    window.__mapReady = true;
  });
})();
</script>
</body>
</html>
